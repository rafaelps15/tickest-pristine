name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # Histórico completo: a auditoria de conformidade avalia os últimos commits (RAS-02/RAS-03).
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'Directory.Build.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test SDD gate hook
        run: python -m unittest discover -s .claude/hooks -p "test_*.py"

      - name: Test agent instructions
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: SDD compliance audit
        run: python scripts/auditoria_sdd.py . --min-score 70

      - name: Restore
        run: dotnet restore TickestPristine.slnx

      # Projeto a projeto: o docker-compose.dcproj da solução não aceita o comando, que falharia pela .slnx.
      - name: Vulnerable packages
        run: |
          for project in $(find src tests -name '*.csproj' | sort); do
            dotnet list "$project" package --vulnerable --include-transitive 2>&1 | tee -a vulnerable-packages.txt
          done
          if grep -qi "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Pacote vulnerável encontrado; veja a lista acima."
            exit 1
          fi

      - name: Build
        run: dotnet build TickestPristine.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test TickestPristine.slnx --configuration Release --no-restore --no-build
          --logger trx --collect "XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx

      # Relatório de cobertura (Cobertura XML), sem mínimo.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml

      # Só confere que a imagem é construída; nada é publicado.
      - name: Build Docker image
        run: docker build --file src/TickestPristine.Web.Api/Dockerfile --tag tickestpristine-web-api:ci .

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish TickestPristine.slnx --configuration Release --no-restore --no-build
