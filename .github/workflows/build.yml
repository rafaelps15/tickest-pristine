name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test SDD gate hook
        run: python -m unittest discover -s .claude/hooks -p "test_*.py"

      - name: Restore
        run: dotnet restore TickestPristine.slnx

      - name: Build
        run: dotnet build TickestPristine.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TickestPristine.slnx --configuration Release --no-restore --no-build

      - name: Publish
        if: github.event_name != 'pull_request'
        run: dotnet publish TickestPristine.slnx --configuration Release --no-restore --no-build
