name: tickestpristine

services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: tickestpristine-web-api
    build:
      context: .
      dockerfile: src/TickestPristine.Web.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081

  postgres:
    image: postgres:17
    container_name: tickestpristine-postgres
    environment:
      - POSTGRES_DB=tickestpristine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5440:5432

  seq:
    image: datalust/seq:2024.3
    container_name: tickestpristine-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - 8090:80

  # Servidor SMTP de desenvolvimento: guarda os e-mails enviados (convites de ativação) sem entregá-los.
  # Interface em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: tickestpristine-mailpit
    ports:
      - 1025:1025
      - 8025:8025
